<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 교실 허브 · 호출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#FFE1EE; --bg-darker:#FFFFFF; --gold:#FF6FA6; --gold-light:#C765D8; --cream:#5B3358;
    --card:#FFF2F8; --danger:#FF5C8A; --border-soft:#FFD3E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:'Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#FFF6FA 0%,#F4ECFE 100%);background-attachment:fixed;color:var(--cream);}
  header{background:linear-gradient(120deg,#FFE1EE,#F4D9FB);border-bottom:3px dashed var(--gold);padding:14px 20px;
    display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(255,111,166,.15);}
  header h1{font-family:'Jua',sans-serif;font-weight:400;font-size:19px;margin:0;flex:1;}
  header a{color:var(--cream);text-decoration:none;background:#fff;border:2px solid var(--border-soft);
    padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;}
  main{max-width:720px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px;}
  section.card{background:#fff;border:2px solid var(--border-soft);border-radius:24px;padding:20px;
    box-shadow:0 10px 28px rgba(216,120,178,.14);}
  section.card h2{font-family:'Jua',sans-serif;font-weight:400;margin:0 0 14px;font-size:16px;color:var(--gold-light);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:#B07AA8;margin-bottom:5px;font-weight:700;}
  .field input[type=text], .field textarea{width:100%;padding:10px 12px;border-radius:10px;
    border:2px solid var(--border-soft);background:#fff;color:var(--cream);font-size:14px;font-family:inherit;}
  .field textarea{min-height:70px;resize:vertical;}
  .target-mode{display:flex;gap:8px;margin-bottom:10px;}
  .target-mode button{flex:1;padding:9px;border-radius:10px;border:2px solid var(--border-soft);background:#fff;
    color:var(--cream);font-weight:700;cursor:pointer;}
  .target-mode button.active{background:linear-gradient(135deg,var(--gold),#FFA6CC);color:#fff;border-color:var(--gold);}
  .class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;}
  .class-chip{background:#fff;border:2px solid var(--border-soft);border-radius:10px;padding:8px 4px;
    text-align:center;font-size:13px;font-weight:700;cursor:pointer;}
  .class-chip.selected{background:linear-gradient(135deg,var(--gold),#FFA6CC);color:#fff;border-color:var(--gold);}
  .quick-msgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .quick-msgs button{background:var(--card);border:2px solid var(--border-soft);color:var(--cream);
    border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .send-btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF8FB0,var(--danger));
    color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(255,92,138,.35);}
  .send-btn:disabled{opacity:.5;}
  .history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px dashed var(--border-soft);font-size:13.5px;}
  .history-row .meta{color:#B98CB0;font-size:11.5px;}
  .status-pill{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:700;white-space:nowrap;}
  .status-pill.active{background:var(--danger);color:#fff;}
  .status-pill.done{background:var(--card);color:#8a5c82;}
  .end-btn{background:transparent;border:2px solid var(--border-soft);color:var(--cream);border-radius:8px;
    padding:4px 8px;font-size:11.5px;cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>📣 통합 교실 허브 <span style="color:var(--gold-light)">· 호출</span></h1>
  <a href="controller.html">🎛 컨트롤러로</a>
</header>

<main>
  <section class="card">
    <h2>호출 보내기</h2>
    <div class="field">
      <label>교사명 / 발신 위치</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="teacherName" placeholder="예: 김OO 교사">
        <input type="text" id="location" placeholder="예: 교무실 / 행정실">
      </div>
    </div>
    <div class="field">
      <label>메시지</label>
      <div class="quick-msgs" id="quickMsgs"></div>
      <textarea id="message" placeholder="예: 잠깐 교무실로 와주세요."></textarea>
    </div>
    <div class="field">
      <label>대상 학급</label>
      <div class="target-mode">
        <button type="button" data-mode="all" class="active">전체 학급</button>
        <button type="button" data-mode="pick">학급 선택</button>
      </div>
      <div class="class-grid" id="classGrid" style="display:none;"></div>
    </div>
    <button class="send-btn" id="btnSend">🚨 호출 보내기</button>
  </section>

  <section class="card">
    <h2>최근 호출 이력</h2>
    <div id="historyBox"><div style="color:#9db3a4;font-size:13px;">이력이 없습니다.</div></div>
  </section>
</main>

<script type="module">
import { GRADES, CLASSES_PER_GRADE, classLabel, getClassId, sendCall, subscribeRecentCalls, acknowledgeCall } from "./shared/classroom-hub-common.js";

// ---- 대상 학급 그리드 ----
let targetMode = 'all';
let selectedClasses = new Set();
const grid = document.getElementById('classGrid');
grid.innerHTML = GRADES.flatMap(g => (CLASSES_PER_GRADE[g]||[]).map(c=>{
  const id = getClassId(g,c);
  return `<div class="class-chip" data-id="${id}">${classLabel(g,c)}</div>`;
})).join('');
grid.querySelectorAll('.class-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const id = chip.dataset.id;
    selectedClasses.has(id) ? selectedClasses.delete(id) : selectedClasses.add(id);
    chip.classList.toggle('selected', selectedClasses.has(id));
  });
});
document.querySelectorAll('.target-mode button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    targetMode = btn.dataset.mode;
    document.querySelectorAll('.target-mode button').forEach(b=>b.classList.toggle('active', b===btn));
    grid.style.display = targetMode === 'pick' ? 'grid' : 'none';
  });
});

// ---- 빠른 메시지 ----
const QUICK = ["잠깐 교무실로 와주세요.", "행정실로 와주세요.", "학부모님 전화 연결 부탁드립니다.", "긴급 사항입니다, 바로 와주세요."];
document.getElementById('quickMsgs').innerHTML = QUICK.map(t=>`<button type="button">${t}</button>`).join('');
document.querySelectorAll('#quickMsgs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ document.getElementById('message').value = btn.textContent; });
});

// ---- 발신 ----
document.getElementById('btnSend').addEventListener('click', async ()=>{
  const teacherName = document.getElementById('teacherName').value.trim();
  const location = document.getElementById('location').value.trim();
  const message = document.getElementById('message').value.trim();
  if(targetMode === 'pick' && selectedClasses.size === 0){
    alert('대상 학급을 하나 이상 선택해주세요.');
    return;
  }
  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  try{
    await sendCall({
      teacherName, location, message,
      targetAll: targetMode === 'all',
      targetClasses: [...selectedClasses]
    });
    document.getElementById('message').value = '';
  } catch(e){
    alert('호출 전송에 실패했습니다: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

// ---- 최근 이력 ----
subscribeRecentCalls(rows=>{
  const box = document.getElementById('historyBox');
  if(!rows.length){ box.innerHTML = '<div style="color:#9db3a4;font-size:13px;">이력이 없습니다.</div>'; return; }
  box.innerHTML = rows.map(r=>{
    const target = r.targetAll ? '전체' : (r.targetClasses||[]).join(', ');
    const time = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString('ko-KR') : '';
    return `
    <div class="history-row">
      <div>
        <div><b>${r.teacherName||'-'}</b> ${r.location?('· '+r.location):''} → ${target}</div>
        <div>${r.message||''}</div>
        <div class="meta">${time}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="status-pill ${r.active?'active':'done'}">${r.active?'전달중':'확인됨'}</span>
        ${r.active ? `<button class="end-btn" data-id="${r.id}">종료</button>` : ''}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.end-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>acknowledgeCall(btn.dataset.id));
  });
});
</script>
</body>
</html>
