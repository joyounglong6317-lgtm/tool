<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 교실 허브 · HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#FFE1EE; --bg-darker:#FFF8FC; --gold:#FF6FA6; --gold-light:#C765D8;
    --cream:#5B3358; --danger:#FF4D89; --danger-bright:#FF1F68; --card:#FFFFFF;
    --border-soft:#FFD3E6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#FFF6FA 0%,#F4ECFE 100%);color:var(--cream);}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;}
  .screen.show{display:flex;}
  #configWarn{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#FFF3D6;border:2px dashed #FFC169;
    color:#8a6a1f;border-radius:10px;padding:6px 14px;font-size:12px;z-index:999;display:none;}
  .setup-corner{position:fixed;bottom:8px;right:10px;font-size:11px;color:#C79BC0;z-index:999;cursor:pointer;}
  .notify-btn{position:fixed;bottom:8px;left:10px;z-index:999;font-size:11.5px;font-weight:700;
    background:#fff;border:2px solid var(--border-soft);color:var(--cream);border-radius:14px;
    padding:5px 12px;cursor:pointer;box-shadow:0 4px 10px rgba(216,120,178,.15);display:none;}
  .notify-btn:hover{border-color:var(--gold);}
  .notify-btn.granted{background:#EAFBF3;border-color:#9EE8C6;color:#1e8a5f;cursor:default;}

  /* ===== 대기 화면 ===== */
  #screenStandby{background:linear-gradient(160deg,#FFF6FA 0%,#F4ECFE 100%);padding:30px 40px;}
  .standby-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
  .school-name{font-family:'Jua',sans-serif;font-size:22px;font-weight:400;color:var(--gold-light);}
  .class-name{font-size:16px;color:#8a5c82;margin-top:2px;font-weight:700;}
  .clock{font-family:'Roboto Mono',monospace;font-size:64px;font-weight:700;text-align:right;line-height:1;
    color:var(--cream);text-shadow:3px 3px 0 var(--border-soft);}
  .date{font-size:18px;color:var(--gold-light);text-align:right;margin-top:8px;font-weight:700;}
  .standby-grid{flex:1;display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:18px;min-height:0;}
  .panel{background:var(--card);border:2px dashed var(--border-soft);border-radius:24px;padding:18px 20px;
    display:flex;flex-direction:column;min-height:0;box-shadow:0 10px 26px rgba(216,120,178,.12);}
  .panel h3{font-family:'Jua',sans-serif;font-weight:400;margin:0 0 12px;font-size:17px;color:var(--gold-light);
    display:flex;align-items:center;gap:8px;}
  .panel .content{overflow-y:auto;flex:1;}
  .meal-item{margin-bottom:16px;animation:mealFadeIn .5s ease both;}
  .meal-item .type{font-weight:900;font-size:14.5px;color:var(--gold-light);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .menu-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{position:relative;display:inline-flex;align-items:center;gap:5px;background:#FFF0F7;border:1.5px solid var(--border-soft);
    border-radius:14px;padding:5px 11px 5px 8px;font-size:13.5px;color:var(--cream);font-weight:700;line-height:1.3;
    animation:chipPop .5s cubic-bezier(.34,1.56,.64,1) both, chipGlow 3.2s ease-in-out infinite;}
  .chip .ico{font-size:16px;display:inline-block;animation:iconBounce 2.4s ease-in-out infinite;}
  /* 뜨끈한 음식(국/찌개/밥 등)에서 모락모락 김이 나는 효과 */
  .chip.steamy::before, .chip.steamy::after{
    content:'';position:absolute;top:-2px;width:3px;height:9px;
    background:linear-gradient(to top, rgba(255,255,255,0), rgba(255,255,255,.85));
    border-radius:3px;filter:blur(1px);opacity:0;pointer-events:none;
    animation:steamRise 2.4s ease-in-out infinite;
  }
  .chip.steamy::before{ left:14px; animation-delay:.1s; }
  .chip.steamy::after{ left:20px; animation-delay:1.1s; }
  @keyframes steamRise{
    0%{ transform:translateY(2px) scaleY(.5); opacity:0; }
    35%{ opacity:.7; }
    75%{ opacity:.25; }
    100%{ transform:translateY(-14px) scaleY(1.3); opacity:0; }
  }
  @keyframes mealFadeIn{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  @keyframes chipPop{
    0%{ transform:scale(.3) translateY(14px); opacity:0; }
    65%{ transform:scale(1.1) translateY(-3px); opacity:1; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes chipGlow{
    0%,100%{ box-shadow:0 0 0 rgba(255,111,166,0); }
    50%{ box-shadow:0 3px 12px rgba(255,111,166,.28); }
  }
  @keyframes iconBounce{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-3px) rotate(-8deg); }
    50%{ transform:translateY(0) rotate(0deg); }
    75%{ transform:translateY(-2px) rotate(6deg); }
  }
  .panel h3{position:relative;}
  .sparkle{position:absolute;top:-6px;font-size:11px;opacity:0;pointer-events:none;animation:sparkleTwinkle 2.6s ease-in-out infinite;}
  .sparkle.s1{ left:150px; animation-delay:.2s; }
  .sparkle.s2{ left:172px; top:4px; font-size:8px; animation-delay:1.1s; }
  .sparkle.s3{ left:190px; animation-delay:1.9s; font-size:9px; }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0; transform:scale(.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(18deg); }
  }
  .meal-photo-wrap{margin-bottom:14px;border-radius:16px;overflow:hidden;border:2px solid var(--border-soft);
    box-shadow:0 10px 22px rgba(255,111,166,.22);animation:mealFadeIn .5s ease both, photoGlow 3.4s ease-in-out infinite;}
  .meal-photo-wrap img{display:block;width:100%;max-height:220px;object-fit:cover;}
  .meal-photo-wrap iframe{display:block;width:100%;height:220px;border:none;background:#fff;}
  @keyframes photoGlow{
    0%,100%{ box-shadow:0 10px 22px rgba(255,111,166,.18); }
    50%{ box-shadow:0 12px 28px rgba(255,111,166,.36); }
  }
  @media (prefers-reduced-motion: reduce){
    .meal-item, .chip, .chip .ico, .chip.steamy::before, .chip.steamy::after,
    .sparkle, .meal-photo-wrap{ animation:none !important; }
  }
  .tt-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border-soft);font-size:15px;align-items:center;}
  .tt-row .p{width:26px;font-weight:900;color:var(--gold);}
  .tt-row .t{margin-left:auto;font-size:12px;color:#B07AA8;font-weight:700;}
  .sc-row{padding:8px 0;border-bottom:1px dashed var(--border-soft);}
  .sc-row .d{font-size:12.5px;color:var(--gold-light);font-weight:700;}
  .sc-row .n{font-size:15px;}
  .empty-note{color:#C79BC0;font-size:13px;line-height:1.7;}
  .src-note{margin-top:8px;font-size:11.5px;color:#B98CB0;text-align:right;}
  .admin-link{color:var(--gold-light);font-weight:700;text-decoration:none;}
  .admin-link:hover{text-decoration:underline;}

  /* ===== 활동 진행 화면 ===== */
  #screenActivity{background:linear-gradient(160deg,#FFF6FA 0%,#F4ECFE 100%);
    align-items:center;justify-content:center;text-align:center;}
  #screenActivity .act-name{font-family:'Jua',sans-serif;font-weight:400;font-size:38px;color:var(--gold-light);margin-bottom:10px;}
  #screenActivity .act-timer{font-family:'Roboto Mono',monospace;font-size:clamp(80px,18vw,220px);font-weight:700;
    line-height:1;color:var(--gold);text-shadow:5px 5px 0 var(--border-soft);}
  #screenActivity .act-sub{font-size:18px;color:#8a5c82;margin-top:10px;font-weight:700;}
  .progress-wrap{width:min(70vw,900px);height:24px;background:var(--border-soft);border-radius:14px;margin-top:26px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));width:0%;transition:width .5s linear;}
  .paused-badge{margin-top:18px;background:linear-gradient(135deg,var(--gold),#FFA6CC);color:#fff;font-weight:900;
    padding:6px 18px;border-radius:20px;font-size:14px;}

  /* ===== 호출 알림 화면 ===== */
  #screenCall{background:var(--danger);align-items:center;justify-content:center;text-align:center;animation:flash 1s infinite;}
  @keyframes flash{ 0%,100%{background:var(--danger);} 50%{background:var(--danger-bright);} }
  #screenCall .siren{font-size:70px;margin-bottom:6px;}
  #screenCall .title{font-family:'Jua',sans-serif;font-weight:400;font-size:32px;letter-spacing:.05em;margin-bottom:18px;color:#fff;}
  #screenCall .from{font-size:26px;font-weight:700;margin-bottom:6px;color:#FFE6F0;}
  #screenCall .msg{font-size:34px;font-weight:900;max-width:80vw;line-height:1.4;margin-bottom:26px;color:#fff;}
  #screenCall .ackBtn{font-size:20px;font-weight:900;padding:14px 40px;border-radius:40px;border:none;
    background:#fff;color:var(--danger);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.15);}
</style>
</head>
<body>
<div id="configWarn">⚠️ Firebase 설정값 미입력 — shared/classroom-hub-common.js 를 확인하세요 (미리보기 모드)</div>
<div class="setup-corner" id="setupCorner">학급: <span id="setupClassLabel">-</span> (변경: URL에 ?grade=2&class=9)</div>
<button class="notify-btn" id="notifyPermBtn" type="button">🔔 창을 내려도 호출 알림 받기</button>

<!-- 대기 화면 -->
<div class="screen" id="screenStandby">
  <div class="standby-top">
    <div>
      <div class="school-name" id="schoolNameEl">학교</div>
      <div class="class-name" id="classNameEl">학년-반</div>
    </div>
    <div>
      <div class="clock" id="clockEl">--:--:--</div>
      <div class="date" id="dateEl">-</div>
    </div>
  </div>
  <div class="standby-grid">
    <div class="panel">
      <h3>🍽 오늘의 급식 <span class="sparkle s1">✨</span><span class="sparkle s2">✨</span><span class="sparkle s3">⭐</span></h3>
      <div class="content" id="mealBox"><div class="empty-note">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <h3>🗓 오늘의 시간표</h3>
      <div class="content" id="ttBox"><div class="empty-note">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <h3>📌 학사일정</h3>
      <div class="content" id="scBox"><div class="empty-note">불러오는 중…</div></div>
    </div>
  </div>
</div>

<!-- 활동 진행 화면 -->
<div class="screen" id="screenActivity">
  <div class="act-name" id="actNameEl">활동</div>
  <div class="act-timer" id="actTimerEl">00:00</div>
  <div class="act-sub" id="actSubEl"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progBar"></div></div>
</div>

<!-- 호출 알림 화면 -->
<div class="screen" id="screenCall">
  <div class="siren">🚨</div>
  <div class="title">교무실 호출</div>
  <div class="from" id="callFrom">-</div>
  <div class="msg" id="callMsg">-</div>
  <button class="ackBtn" id="ackBtn">확인했어요</button>
</div>

<script type="module">
import {
  IS_CONFIG_READY, SCHOOL, getSelectedClass, setSelectedClass, classLabel, getClassId,
  subscribeState, subscribeCallsForClass, acknowledgeCall, speak, fmtClock, fmtDate, fmtCountdown,
  subscribeManualTimetable, subscribeManualSchedule, subscribeMealUpload
} from "./shared/classroom-hub-common.js";
import { getStandbyInfo, mealEmoji, mealTypeEmoji, isHotDish, ymd } from "./shared/neis.js";

document.getElementById('configWarn').style.display = IS_CONFIG_READY ? 'none' : 'block';

// ---- 학급 결정: URL 파라미터 우선, 없으면 localStorage ----
const urlParams = new URLSearchParams(location.search);
let { grade, cls } = getSelectedClass();
if(urlParams.get('grade')) grade = Number(urlParams.get('grade'));
if(urlParams.get('class')) cls = Number(urlParams.get('class'));
setSelectedClass(grade, cls);
const classId = getClassId(grade, cls);

document.getElementById('schoolNameEl').textContent = SCHOOL.name;
document.getElementById('classNameEl').textContent = classLabel(grade, cls);
document.getElementById('setupClassLabel').textContent = classLabel(grade, cls);

// ---- 화면 전환 관리 ----
const screens = {
  standby: document.getElementById('screenStandby'),
  activity: document.getElementById('screenActivity'),
  call: document.getElementById('screenCall')
};
let currentScreen = null;
function showScreen(name){
  if(currentScreen === name) return;
  currentScreen = name;
  Object.entries(screens).forEach(([k,el])=>el.classList.toggle('show', k===name));
}

// ---- 시계 ----
setInterval(()=>{
  const now = new Date();
  document.getElementById('clockEl').textContent = fmtClock(now);
  document.getElementById('dateEl').textContent = fmtDate(now);
}, 1000);

// ---- 대기화면: NEIS 정보 + 선생님이 admin.html에서 직접 입력한 정보를 합쳐서 표시 ----
let neisMeal = [], neisTimetable = [], neisTimetableFailed = false;
let neisSchedule = [];
let manualTimetableDays = {};   // { mon:[{period,subject}], ... } (이 학급용, admin.html에서 입력)
let manualScheduleList = [];    // [{id,date,name}] 전체 학급 공통(admin.html에서 입력)
let mealUploadToday = null;     // admin.html에서 오늘 날짜로 올린 급식 사진/PDF { url, contentType, fileName }

async function loadNeisInfo(){
  try{
    const info = await getStandbyInfo(SCHOOL, grade, cls);
    neisMeal = info.meal;
    neisTimetable = info.timetable;
    neisSchedule = info.schedule;
    neisTimetableFailed = false;
    if(info.errors && info.errors.length) console.warn('[hud] NEIS 일부 오류:', info.errors);
  }catch(e){
    console.error('[hud] NEIS 로드 실패:', e);
    neisMeal = []; neisTimetable = []; neisSchedule = [];
    neisTimetableFailed = true;
  }
  renderMeal();
  renderTimetable();
  renderSchedule();
}

// 학급별 주간 시간표(admin.html에서 입력) 실시간 구독 — 나이스 시간표가 비어있을 때 대신 보여줌
subscribeManualTimetable(classId, data=>{
  manualTimetableDays = (data && data.days) || {};
  renderTimetable();
});
// 전체 학급 공통 학사일정(admin.html에서 입력) 실시간 구독 — 나이스 학사일정과 합쳐서 보여줌
subscribeManualSchedule(rows=>{
  manualScheduleList = rows;
  renderSchedule();
});

// 급식 사진/PDF 업로드(admin.html) 실시간 구독 — 날짜가 바뀌면 오늘 날짜 문서로 다시 구독
let mealUploadUnsub = null;
let mealUploadDate = null;
function resubscribeMealUpload(){
  const today = ymd(new Date());
  if(today === mealUploadDate) return;
  mealUploadDate = today;
  if(mealUploadUnsub) mealUploadUnsub();
  mealUploadUnsub = subscribeMealUpload(today, data=>{
    mealUploadToday = data;
    renderMeal();
  });
}
resubscribeMealUpload();

function renderMeal(){
  const box = document.getElementById('mealBox');

  // 관리자가 admin.html에서 오늘 날짜로 급식 사진/PDF를 올려뒀으면 맨 위에 자동으로 보여준다
  let photoHtml = '';
  if(mealUploadToday && mealUploadToday.url){
    const isPdf = (mealUploadToday.contentType || '').includes('pdf') || /\.pdf$/i.test(mealUploadToday.fileName || '');
    photoHtml = `<div class="meal-photo-wrap">${
      isPdf
        ? `<iframe src="${mealUploadToday.url}" title="오늘의 급식 PDF"></iframe>`
        : `<img src="${mealUploadToday.url}" alt="오늘의 급식 사진">`
    }</div>`;
  }

  if(!neisMeal || !neisMeal.length){
    box.innerHTML = photoHtml || '<div class="empty-note">오늘은 급식 정보가 없습니다.</div>';
    return;
  }
  // 카드/칩이 순서대로 통통 튀며 나타나도록 애니메이션 지연 시간을 하나씩 어긋나게 부여
  const mealHtml = neisMeal.map((m, mi)=>`
    <div class="meal-item" style="animation-delay:${(mi*0.15).toFixed(2)}s">
      <div class="type">${mealTypeEmoji(m.mealType)} ${m.mealType}</div>
      <div class="menu-chips">${m.menu.map((d,i)=>{
        const popDelay = (mi*0.2 + i*0.09).toFixed(2);
        const bounceDelay = ((i*0.18) % 1.8).toFixed(2);
        const steamy = isHotDish(d) ? ' steamy' : '';
        return `<span class="chip${steamy}" style="animation-delay:${popDelay}s"><span class="ico" style="animation-delay:${bounceDelay}s">${mealEmoji(d)}</span>${d}</span>`;
      }).join('')}</div>
    </div>`).join('');
  box.innerHTML = photoHtml + mealHtml;
}

function renderTimetable(){
  const box = document.getElementById('ttBox');
  let rows = neisTimetable;
  let isManual = false;

  if(!rows || !rows.length){
    // 나이스에 오늘 시간표가 없으면(학교 등록 누락 등), 선생님이 admin.html에서 입력한
    // 이 학급의 주간 시간표에서 오늘 요일에 해당하는 시간표로 대신 보여준다.
    const dow = new Date().getDay(); // 0=일 ... 6=토
    const key = ['sun','mon','tue','wed','thu','fri','sat'][dow];
    const manualRows = (manualTimetableDays[key] || []).slice().sort((a,b)=>Number(a.period)-Number(b.period));
    if(manualRows.length){ rows = manualRows; isManual = true; }
  }

  if(!rows || !rows.length){
    box.innerHTML = `<div class="empty-note">오늘은 시간표 정보가 없습니다.<br><a class="admin-link" href="admin.html" target="_blank">✏️ 시간표 직접 입력하기</a></div>`;
    return;
  }
  box.innerHTML = rows.map(r=>`<div class="tt-row"><span class="p">${r.period}</span><span>${r.subject}</span>${r.teacher?`<span class="t">${r.teacher}</span>`:''}</div>`).join('')
    + (isManual ? '<div class="src-note">✏️ 선생님이 직접 입력한 시간표예요</div>' : '');
}

function renderSchedule(){
  const box = document.getElementById('scBox');
  const todayStr = ymd(new Date());
  const seen = new Set();
  const combined = [];
  neisSchedule.forEach(e=>{
    const k = e.date + '|' + e.name;
    if(seen.has(k)) return;
    seen.add(k);
    combined.push({ date: e.date, name: e.name, manual:false });
  });
  manualScheduleList
    .filter(e => e.date >= todayStr)
    .forEach(e=>{
      const k = e.date + '|' + e.name;
      if(seen.has(k)) return;
      seen.add(k);
      combined.push({ date: e.date, name: e.name, manual:true });
    });
  combined.sort((a,b)=> a.date.localeCompare(b.date));
  const rows = combined.slice(0, 6);

  if(!rows.length){
    box.innerHTML = `<div class="empty-note">예정된 학사일정이 없습니다.<br><a class="admin-link" href="admin.html" target="_blank">✏️ 학사일정 직접 입력하기</a></div>`;
    return;
  }
  box.innerHTML = rows.map(e=>{
    const d = `${e.date.slice(0,4)}.${e.date.slice(4,6)}.${e.date.slice(6,8)}`;
    return `<div class="sc-row"><div class="d">${d}${e.manual?' · ✏️':''}</div><div class="n">${e.name}</div></div>`;
  }).join('');
}

loadNeisInfo();
setInterval(loadNeisInfo, 30*60*1000); // 30분마다 갱신
let lastDay = new Date().getDate();
setInterval(()=>{ const d = new Date().getDate(); if(d !== lastDay){ lastDay = d; loadNeisInfo(); resubscribeMealUpload(); } }, 60*1000);

// ---- 컨트롤러 state 구독 (활동 진행) ----
let lastState = null;
let lastSpokenNonce = null;
let lastStartedAt = null;
let tickHandle = null;
// 호출(calls) 관련 변수도 미리 선언(아래 subscribeState 콜백이 evaluateScreen을 통해 참조함)
let activeCalls = [];
const spokenCallIds = new Set();

subscribeState(classId, state=>{
  lastState = state;
  evaluateScreen();

  if(!state) return;

  // TTS: 즉시 안내
  if(state.ttsNonce && state.ttsNonce !== lastSpokenNonce){
    lastSpokenNonce = state.ttsNonce;
    if(state.ttsMessage) speak(state.ttsMessage);
  }
  // TTS: 활동 시작 안내
  if(state.mode === 'running' && state.startedAt !== lastStartedAt){
    lastStartedAt = state.startedAt;
    if(state.activityName) speak(`${state.activityName} 시작합니다.`);
  }

  if(state.mode === 'running' || state.mode === 'paused'){
    document.getElementById('actNameEl').textContent = state.activityName || '활동';
    if(tickHandle) clearInterval(tickHandle);
    function tick(){
      const timerEl = document.getElementById('actTimerEl');
      const subEl = document.getElementById('actSubEl');
      const bar = document.getElementById('progBar');
      if(state.mode === 'paused'){
        timerEl.textContent = state.pausedRemainingSec != null ? fmtCountdown(state.pausedRemainingSec) : '일시정지';
        subEl.innerHTML = '<span class="paused-badge">⏸ 일시정지</span>';
        if(state.durationSec > 0 && state.pausedRemainingSec != null){
          bar.style.width = Math.max(0, 100 - (state.pausedRemainingSec/state.durationSec*100)) + '%';
        }
        return;
      }
      if(state.durationSec > 0){
        const remaining = Math.max(0, state.durationSec - (Date.now()-state.startedAt)/1000);
        timerEl.textContent = fmtCountdown(remaining);
        subEl.textContent = remaining <= 0 ? '시간이 종료되었습니다' : '';
        bar.style.width = Math.max(0, 100 - remaining/state.durationSec*100) + '%';
      } else {
        const elapsed = (Date.now()-state.startedAt)/1000;
        timerEl.textContent = fmtCountdown(elapsed);
        subEl.textContent = '경과 시간';
        bar.style.width = '100%';
      }
    }
    tick();
    tickHandle = setInterval(tick, 500);
  } else {
    if(tickHandle) clearInterval(tickHandle);
  }
});

// ---- 창을 내리거나 다른 탭으로 전환했을 때도 호출을 알아차리도록: 브라우저 알림 + 탭 제목 깜빡임 ----
const ORIGINAL_TITLE = document.title;
const notifyBtn = document.getElementById('notifyPermBtn');
let titleFlashHandle = null;

function startTitleFlash(text){
  if(titleFlashHandle) return;
  let on = false;
  titleFlashHandle = setInterval(()=>{
    document.title = on ? ORIGINAL_TITLE : text;
    on = !on;
  }, 1000);
}
function stopTitleFlash(){
  if(titleFlashHandle){ clearInterval(titleFlashHandle); titleFlashHandle = null; }
  document.title = ORIGINAL_TITLE;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && !activeCalls.length) stopTitleFlash();
});

function updateNotifyBtn(){
  if(!('Notification' in window)){ notifyBtn.style.display = 'none'; return; }
  if(Notification.permission === 'granted'){
    notifyBtn.textContent = '🔔 호출 알림 켜짐';
    notifyBtn.classList.add('granted');
    notifyBtn.style.display = 'inline-block';
  } else if(Notification.permission === 'denied'){
    notifyBtn.style.display = 'none'; // 브라우저에서 막아둔 상태 — 다시 요청해도 소용없음
  } else {
    notifyBtn.textContent = '🔔 창을 내려도 호출 알림 받기';
    notifyBtn.classList.remove('granted');
    notifyBtn.style.display = 'inline-block';
  }
}
notifyBtn.addEventListener('click', async ()=>{
  if(!('Notification' in window) || Notification.permission !== 'default') return;
  try{ await Notification.requestPermission(); }catch(e){ console.warn('[hud] 알림 권한 요청 실패:', e); }
  updateNotifyBtn();
});
updateNotifyBtn();

let activeCallNotification = null;
function notifyCallIfHidden(latest){
  if(document.visibilityState === 'visible') return; // 화면을 보고 있으면 화면 전환 + 음성 안내로 충분
  startTitleFlash('🚨 호출이 왔어요! 클릭하세요');
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification('🚨 교무실 호출', {
        body: `${latest.teacherName || '교무실'}${latest.location ? ' · ' + latest.location : ''}\n${latest.message || '교무실로 와주세요.'}`,
        tag: 'classroom-hub-call', // 여러 알림이 겹쳐 쌓이지 않도록 같은 태그로 대체
        requireInteraction: true  // 확인/클릭하기 전까지 카톡 알림처럼 화면에 계속 떠있게 함(크롬/엣지 데스크톱 지원)
      });
      activeCallNotification = n;
      n.onclick = () => { window.focus(); n.close(); };
      n.onclose = () => { activeCallNotification = null; };
    }catch(e){ console.warn('[hud] 브라우저 알림 표시 실패:', e); }
  }
}

// ---- 호출(calls) 구독 ----
subscribeCallsForClass(classId, rows=>{
  activeCalls = rows;
  evaluateScreen();
  if(!rows.length){
    stopTitleFlash();
    if(activeCallNotification){ activeCallNotification.close(); activeCallNotification = null; }
  }
  const latest = rows[0];
  if(latest && !spokenCallIds.has(latest.id)){
    spokenCallIds.add(latest.id);
    document.getElementById('callFrom').textContent = `${latest.teacherName || '교무실'}${latest.location ? ' · ' + latest.location : ''}`;
    document.getElementById('callMsg').textContent = latest.message || '교무실로 와주세요.';
    speak(`${latest.teacherName || '교무실'}에서 호출입니다. ${latest.message || ''}`);
    notifyCallIfHidden(latest);
  }
});
document.getElementById('ackBtn').addEventListener('click', ()=>{
  activeCalls.forEach(c=>acknowledgeCall(c.id));
  stopTitleFlash();
  if(activeCallNotification){ activeCallNotification.close(); activeCallNotification = null; }
});

// ---- 화면 우선순위: 호출 > 활동 진행 > 대기화면 ----
function evaluateScreen(){
  if(activeCalls.length){ showScreen('call'); return; }
  if(lastState && (lastState.mode === 'running' || lastState.mode === 'paused')){ showScreen('activity'); return; }
  showScreen('standby');
}
evaluateScreen();
</script>
