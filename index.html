<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#FF6FA6; --gold-light:#C765D8; --cream:#5B3358; --border-soft:#FFD3E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:'Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#FFF6FA 0%,#F4ECFE 100%);color:var(--cream);
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  main{max-width:640px;width:100%;}
  h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;margin:0 0 6px;color:var(--gold-light);}
  p.sub{margin:0 0 26px;color:#8a5c82;font-size:14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--cream);
    background:#fff;border:2px solid var(--border-soft);border-radius:20px;padding:18px;
    box-shadow:0 8px 20px rgba(216,120,178,.14);transition:.15s;}
  a.card:hover{border-color:var(--gold);transform:translateY(-2px);}
  a.card .ico{font-size:28px;}
  a.card .name{font-weight:900;font-size:15px;}
  a.card .desc{font-size:12.5px;color:#8a5c82;}
</style>
</head>
<body>
<main>
  <h1>🎀 통합 교실 허브</h1>
  <p class="sub">모듈을 선택해서 열어주세요.</p>
  <div class="grid">
    <a class="card" href="classroom-hub/controller.html">
      <span class="ico">🎛️</span>
      <span class="name">컨트롤러</span>
      <span class="desc">프리셋·타이머·TTS 안내</span>
    </a>
    <a class="card" href="classroom-hub/hud.html">
      <span class="ico">🖥</span>
      <span class="name">HUD (학생 화면)</span>
      <span class="desc">대기화면·활동화면·호출알림</span>
    </a>
    <a class="card" href="classroom-hub/sound-center.html">
      <span class="ico">🔊</span>
      <span class="name">소리센터</span>
      <span class="desc">실시간 소음 레벨 표시</span>
    </a>
    <a class="card" href="classroom-hub/participation.html">
      <span class="ico">🏆</span>
      <span class="name">참여게임</span>
      <span class="desc">포인트판·랜덤 뽑기</span>
    </a>
    <a class="card" href="classroom-hub/call.html">
      <span class="ico">📣</span>
      <span class="name">호출</span>
      <span class="desc">교무실 → HUD 알림 발신</span>
    </a>
  </div>
</main>
</body>
</html>
